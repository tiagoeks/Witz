<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="acrylicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.4)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800 M0 500 H800" />
    <path d="M100 0 V600 M200 0 V600 M300 0 V600 M400 0 V600 M500 0 V600 M600 0 V600 M700 0 V600" />
  </g>

  <!-- Product Illustration: Isometric 3D Acrylic Form -->
  <g transform="translate(180, 150)">
    <!-- Base / Back faces -->
    <path d="M 50 150 L 350 50 L 400 120 L 100 220 Z" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <path d="M 350 50 L 350 250 L 400 320 L 400 120 Z" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    
    <!-- U-Shape Body -->
    <path d="M 50 150 L 50 350 L 100 420 L 400 320 L 400 120 L 350 50 L 100 220 Z" fill="url(#acrylicGrad)" stroke="rgba(255,255,255,0.6)" stroke-dasharray="0" stroke-width="2.5"/>
    <path d="M 50 150 L 100 220 L 100 420 L 50 350 Z" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    
    <!-- Front Highlights -->
    <line x1="50" y1="350" x2="400" y2="230" stroke="#3b82f6" stroke-width="3" filter="url(#glow)"/>
    <line x1="100" y1="220" x2="100" y2="420" stroke="#8b5cf6" stroke-width="2.5"/>
    
    <!-- Rounded corner indicator -->
    <circle cx="100" cy="420" r="4" fill="#60a5fa"/>
    <circle cx="50" cy="350" r="4" fill="#a78bfa"/>
  </g>

  <!-- Badge / Watermark -->
  <rect x="50" y="40" width="160" height="36" rx="18" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(139, 92, 246, 0.4)"/>
  <text x="130" y="63" fill="#a78bfa" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">WITZ OFFICIAL</text>

  <!-- Label text -->
  <text x="400" y="520" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Forma Acrílica Slice Cake 30x10cm</text>
  <text x="400" y="550" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">Acrílico Cristal Premium 3mm • Encaixes Precisos</text>
</svg>
