<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Blueprint Diagram -->
  <g transform="translate(180, 150)">
    <rect x="80" y="80" width="440" height="200" rx="10" fill="rgba(6, 182, 212, 0.05)" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6,4"/>
    
    <!-- Internal Dimensions Line -->
    <line x1="100" y1="180" x2="500" y2="180" stroke="#38bdf8" stroke-width="2"/>
    <text x="300" y="170" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Internas: 30 cm (Comprimento)</text>
    
    <line x1="500" y1="100" x2="500" y2="260" stroke="#38bdf8" stroke-width="2"/>
    <text x="525" y="185" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold">10 cm (Altura)</text>

    <!-- External Dimensions Indicator -->
    <text x="300" y="50" fill="#a78bfa" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Medidas Externas: 33 x 10,7 x 10,3 cm</text>
    <text x="300" y="320" fill="#a78bfa" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Espessura do Acrílico: 3 mm</text>
  </g>

  <text x="400" y="520" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Esquema Técnico de Dimensões</text>
  <text x="400" y="550" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">Medidas Internas 30x10x10cm | Medidas Externas 33x10,7x10,3cm</text>
</svg>
